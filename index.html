<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Corre - Gestão para Entregadores</title>
<style>
body { font-family: Arial, sans-serif; background: #101827; color: white; margin: 0; padding: 20px; }
h1 { color: #22c55e; text-align: center; }
.card { background: #1e293b; padding: 20px; margin: 15px 0; border-radius: 12px; }
.valor { font-size: 28px; color: #22c55e; font-weight: bold; }
section { margin-top: 30px; }
section h2 { border-bottom: 2px solid #334155; padding-bottom: 10px; }
form { margin-top: 15px; }
label { display: block; margin-bottom: 5px; }
input { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #334155; border-radius: 6px; box-sizing: border-box; background: #0f172a; color: white; }
button { width: 100%; padding: 10px; background: #22c55e; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>
<header>
<h1>MEU CORRE</h1>
</header>
<main>
<div class="card">
<h2>Resumo do Dia</h2>
<p>Ganhos de hoje:</p>
<div class="valor">R$ 0,00</div>
</div>
</main>
<section>
<h2>Login</h2>
<form>
<label>Email:</label>
<input type="email" required>
<label>Senha:</label>
<input type="password" required>
<button type="submit">Entrar</button>
</form>
</section>
</body>
</html>

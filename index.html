

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Corre - Gestão para Entregadores</title>

<style>
* { box-sizing: border-box; }

body {
  font-family: Arial, sans-serif;
  background: #101827;
  color: white;
  margin: 0;
  padding: 20px;
}

h1 {
  color: #22c55e;
  text-align: center;
}

.card {
  background: #1e293b;
  padding: 20px;
  margin: 15px 0;
  border-radius: 12px;
}

.resumo {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.valor {
  font-size: 22px;
  font-weight: bold;
  margin-top: 8px;
}

.verde { color: #22c55e; }
.vermelho { color: #f87171; }

section { margin-top: 25px; }

label {
  display: block;
  margin: 12px 0 6px;
}

input, select {
  width: 100%;
  padding: 12px;
  border: 1px solid #334155;
  border-radius: 6px;
  background: #0f172a;
  color: white;
}

button {
  width: 100%;
  padding: 12px;
  margin-top: 15px;
  background: #22c55e;
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: bold;
  cursor: pointer;
}

.lancamento {
  background: #0f172a;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
}

.excluir {
  background: #dc2626;
  padding: 8px;
}

small { color: #94a3b8; }
</style>
</head>

<body>

<header>
<h1>MEU CORRE</h1>
<p style="text-align:center">Sua vida financeira na palma da mão</p>
</header>

<main>

<div class="card">
<h2>Resumo de hoje</h2>

<div class="resumo">
<div>
<small>Ganhos</small>
<div class="valor verde" id="ganhos">R$ 0,00</div>
</div>

<div>
<small>Despesas</small>
<div class="valor vermelho" id="despesas">R$ 0,00</div>
</div>
</div>

<hr style="border-color:#334155;margin:20px 0">

<small>Saldo líquido do dia</small>
<div class="valor verde" id="saldo">R$ 0,00</div>
</div>

<section class="card">
<h2>Novo lançamento</h2>

<form id="formulario">

<label>Tipo de lançamento</label>
<select id="tipo" required>
<option value="ganho">Ganho</option>
<option value="despesa">Despesa</option>
</select>

<label>Descrição</label>
<input id="descricao" type="text"
placeholder="Ex: Entrega, alimentação, manutenção"
required>

<label>Valor (R$)</label>
<input id="valor" type="number"
step="0.01" min="0.01"
placeholder="0,00" required>

<label>Data</label>
<input id="data" type="date" required>

<button type="submit">SALVAR LANÇAMENTO</button>

</form>
</section>

<section class="card">
<h2>Histórico de lançamentos</h2>
<div id="historico">
<p>Nenhum lançamento registrado.</p>
</div>
</section>

</main>

<script>
const chave = "meuCorreLancamentos";

let lancamentos = JSON.parse(
  localStorage.getItem(chave) || "[]"
);

const hoje = () => {
  const d = new Date();
  return [
    d.getFullYear(),
    String(d.getMonth() + 1).padStart(2, "0"),
    String(d.getDate()).padStart(2, "0")
  ].join("-");
};

document.getElementById("data").value = hoje();

function moeda(valor) {
  return Number(valor).toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL"
  });
}

function salvarDados() {
  localStorage.setItem(chave, JSON.stringify(lancamentos));
}

function atualizar() {
  const dataAtual = hoje();

  const doDia = lancamentos.filter(
    item => item.data === dataAtual
  );

  const ganhos = doDia
    .filter(item => item.tipo === "ganho")
    .reduce((total, item) => total + item.valor, 0);

  const despesas = doDia
    .filter(item => item.tipo === "despesa")
    .reduce((total, item) => total + item.valor, 0);

  document.getElementById("ganhos").textContent = moeda(ganhos);
  document.getElementById("despesas").textContent = moeda(despesas);

  const saldo = ganhos - despesas;
  const elementoSaldo = document.getElementById("saldo");

  elementoSaldo.textContent = moeda(saldo);
  elementoSaldo.className = "valor " +
    (saldo >= 0 ? "verde" : "vermelho");

  const historico = document.getElementById("historico");

  historico.innerHTML = "";

  if (lancamentos.length === 0) {
    historico.textContent = "Nenhum lançamento registrado.";
    return;
  }

  [...lancamentos]
    .sort((a, b) => b.data.localeCompare(a.data))
    .forEach(item => {
      const div = document.createElement("div");
      div.className = "lancamento";

      const titulo = document.createElement("strong");
      titulo.textContent = item.descricao;

      const detalhe = document.createElement("p");
      detalhe.textContent =
        (item.tipo === "ganho" ? "Ganho: " : "Despesa: ") +
        moeda(item.valor);

      const data = document.createElement("small");
      data.textContent = item.data.split("-").reverse().join("/");

      const excluir = document.createElement("button");
      excluir.className = "excluir";
      excluir.textContent = "Excluir lançamento";

      excluir.onclick = () => {
        if (confirm("Deseja excluir este lançamento?")) {
          lancamentos = lancamentos.filter(
            registro => registro.id !== item.id
          );
          salvarDados();
          atualizar();
        }
      };

      div.append(titulo, detalhe, data, excluir);
      historico.appendChild(div);
    });
}

document.getElementById("formulario")
.addEventListener("submit", function(event) {
  event.preventDefault();

  const tipo = document.getElementById("tipo").value;
  const descricao = document.getElementById("descricao").value.trim();
  const valor = Number(document.getElementById("valor").value);
  const data = document.getElementById("data").value;

  if (!descricao || valor <= 0 || !data) {
    alert("Confira os dados do lançamento.");
    return;
  }

  lancamentos.push({
    id: Date.now().toString(),
    tipo,
    descricao,
    valor,
    data
  });

  salvarDados();
  atualizar();

  this.reset();
  document.getElementById("data").value = hoje();

  alert("Lançamento salvo com sucesso!");
});

atualizar();
</script>

</body>
</html>

DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu Corre - Gestão para Entregadores</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      padding: 20px;
    }
    h1 {
      color: #22c55e;
      text-align: center;
    }
    .card {
      background: #1e293b;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
    }
    .valor {
      font-size: 28px;
      color: #22c55e;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header>
    <h1>🚀 MEU CORRE</h1>
  </header>

  <main>
    <div class="card">
      <h2>Resumo do Dia</h2>
      <p>Ganhos de hoje:</p>
      <div class="valor">R$ 0,00</div>
    </div>
  </main>
<section>
  <h2>Login</h2>
  <form>
    <label>Email:</label><br>
    <input type="email" required><br><br>
    <label>Senha:</label><br>
    <input type="password" required><br><br>
    <button type="submit">Entrar</button>
  </form>
</section>
<section>
  <h2>Painel de Ganhos</h2>
  <p>Total na semana: R$ 0,00</p>
</section>

<label>Nome:</label><br>
  <input type="text" required><br><br>
  <label>Veículo:</label><br>
  <input type="text" required><br><br>
  <label>Telefone:</label><br>
  <input type="tel" required><br><br>
  <button type="submit">Cadastrar</button>
</body>
</html>


services:
  - type: web
    name: meu-corre-salve
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6.2-astra
      - key: FRONTEND_ORIGIN
        sync: false
